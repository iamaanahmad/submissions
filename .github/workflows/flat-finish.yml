name: Flat Finish
on:
  push:
    paths: ['flat-finish/**', '.github/workflows/flat-finish.yml']
  pull_request:
    paths: ['flat-finish/**', '.github/workflows/flat-finish.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s flat-finish -v
