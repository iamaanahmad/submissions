[project]
name = "handoff-guard"
version = "0.1.0"
description = "A local Strands agent that builds evidence-checked project handoffs."
requires-python = ">=3.11"
dependencies = ["strands-agents[openai]==1.54.0", "pydantic==2.13.5"]

[project.scripts]
handoff-guard = "handoff_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
